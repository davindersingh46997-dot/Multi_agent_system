[project]
name = "multi-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Davinder Singh", email = "davindersingh46997@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "argon2-cffi>=23.1.0",
    "fastapi>=0.115.0",
    "fastmcp>=2.12.0,<5.0.0",
    "huggingface-hub>=1.0.0",
    "langchain>=1.0.0",
    "langchain-huggingface>=1.0.0",
    "langchain-openai>=1.0.0",
    "pillow>=10.0.0",
    "pydantic-settings>=2.6.0",
    "PyJWT>=2.9.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.18",
    "psycopg[binary]>=3.2.0",
    "reportlab>=4.2.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[project.scripts]
multi-agent = "brain.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.build-backend]
module-name = "brain"
module-root = ""
